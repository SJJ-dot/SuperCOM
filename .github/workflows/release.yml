name: build-release

# 触发方式：
#   - 推送 v* 标签（如 v2.1.0）→ 从 master 缓存恢复 Qt → 编译应用 → 创建 Release
#   - 手动触发（Actions 页面 Run workflow）→ 同 master 推送
#
# ⚠️ 缓存作用域：GitHub Actions 缓存按分支/tag 隔离，不同 tag 之间互不可见。
#    tag 触发的 workflow 只能读取默认分支(master)的缓存。因此 Qt 编译必须在
#    master 上执行并保存缓存，tag 触发时仅恢复缓存——否则每个新 tag 都要全量
#    重编 Qt（~37 分钟）。详见:
#    https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows#restrictions-for-accessing-a-cache
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============ job 1: 编译静态 Qt 库（仅在 master 分支执行并缓存） ============
  # actions/cache 只在 job 成功时保存。把 Qt 编译拆成独立 job，
  # 即使后续应用编译失败，Qt 缓存也已被保存，下次不再全量重编。
  #
  # ⚠️ 只在分支(非 tag)上运行：tag 缓存作用域互相隔离，在 tag 上保存的缓存
  #    其他 tag 无法访问。在 master 上保存的缓存所有 tag/分支都能读取。
  build-qt-static:
    name: Build static Qt libs (cached)
    runs-on: windows-latest
    if: github.ref_type == 'branch'
    timeout-minutes: 90
    env:
      W64DEVKIT: ${{ github.workspace }}\w64devkit
      QT_SRC: ${{ github.workspace }}\qt-src
      QT_STATIC_PREFIX: ${{ github.workspace }}\qt-static

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download w64devkit (MinGW gcc 13)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/skeeto/w64devkit/releases/download/v1.23.0/w64devkit-1.23.0.zip" -OutFile w64devkit.zip
          Expand-Archive w64devkit.zip -DestinationPath "$env:GITHUB_WORKSPACE" -Force
          & "$env:GITHUB_WORKSPACE\w64devkit\bin\gcc.exe" --version | Select-Object -First 1

      # w64devkit v1.23.0 不包含 ninja，单独下载放入其 bin
      - name: Download ninja (for w64devkit v1.23.0)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip" -OutFile ninja.zip
          Expand-Archive ninja.zip -DestinationPath "$env:GITHUB_WORKSPACE\ninja" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\ninja\ninja.exe" "$env:GITHUB_WORKSPACE\w64devkit\bin\ninja.exe" -Force

      - name: Cache Qt sources
        id: cache-qt-src
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\qt-src\qtbase
            ${{ github.workspace }}\qt-src\qt5compat
            ${{ github.workspace }}\qt-src\qtserialport
          key: qt-src-6.8.2-${{ runner.os }}

      # 编译好的静态 Qt 库缓存：本 job 成功即保存，后续 job 命中则跳过全量编译
      # v2: Qt 库改用 -Os + -ffunction-sections 重编（配合应用 --gc-sections 瘦身）
      # v3: 追加 feature 裁剪 -no-feature-udp/sctp/dtls/jpeg，进一步瘦身
      #     每次 Qt 编译参数变化都要升版本号，否则旧缓存命中导致新参数不生效
      - name: Cache static Qt libs
        id: cache-qt-static
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\qt-static
          key: qt-static-6.8.2-${{ runner.os }}-v3

      # 关键修复：只有缓存未命中才编译 Qt，命中则跳过 30 分钟构建
      - name: Build static Qt libs only (QT_ONLY=1)
        if: steps.cache-qt-static.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          set QT_ONLY=1
          call cpp\build_static.bat

      # 调试信息：便于确认是否命中缓存
      - name: Cache debug info
        shell: pwsh
        run: |
          Write-Host "cache-hit(static): ${{ steps.cache-qt-static.outputs.cache-hit }}"
          if (Test-Path "$env:GITHUB_WORKSPACE\qt-static") {
            Write-Host "qt-static exists"
          } else {
            Write-Host "qt-static missing"
          }

  # ============ job 2: 恢复缓存 → 编译应用 → strip → 发布 ============
  build-app:
    name: Build & release app
    needs: build-qt-static
    # master 推送时 build-qt-static 正常执行 → 本 job 等其完成后运行
    # tag 推送时 build-qt-static 被跳过(skipped) → 本 job 仍需运行，
    # 从 master 缓存恢复 Qt 库后直接编译应用
    if: ${{ !cancelled() && (needs.build-qt-static.result == 'success' || needs.build-qt-static.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      W64DEVKIT: ${{ github.workspace }}\w64devkit
      QT_SRC: ${{ github.workspace }}\qt-src
      QT_STATIC_PREFIX: ${{ github.workspace }}\qt-static

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download w64devkit (MinGW gcc 13)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/skeeto/w64devkit/releases/download/v1.23.0/w64devkit-1.23.0.zip" -OutFile w64devkit.zip
          Expand-Archive w64devkit.zip -DestinationPath "$env:GITHUB_WORKSPACE" -Force

      - name: Download ninja (for w64devkit v1.23.0)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip" -OutFile ninja.zip
          Expand-Archive ninja.zip -DestinationPath "$env:GITHUB_WORKSPACE\ninja" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\ninja\ninja.exe" "$env:GITHUB_WORKSPACE\w64devkit\bin\ninja.exe" -Force

      # 恢复 master 分支上保存的 Qt 缓存（tag 触发时也能读取 master 缓存）
      - name: Cache Qt sources
        id: cache-qt-src
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\qt-src\qtbase
            ${{ github.workspace }}\qt-src\qt5compat
            ${{ github.workspace }}\qt-src\qtserialport
          key: qt-src-6.8.2-${{ runner.os }}

      - name: Cache static Qt libs
        id: cache-qt-static
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\qt-static
          key: qt-static-6.8.2-${{ runner.os }}-v3

      # Qt 缓存命中时 build_static.bat 自动跳过 [3/6]-[5/6]，直接编译应用
      # 版本号：tag 触发时取 tag 名（去 v 前缀，如 v2.0.3 -> 2.0.3），
      # 分支触发(如 master)时从远程取最新 v* tag，取不到则 "dev"
      #
      # ⚠️ 之前在此失败：git describe 在浅克隆(actions/checkout 默认
      #    fetch-depth=1)且 HEAD 无可达 tag 时返回非零退出码，而 GitHub
      #    Actions 的 pwsh 会把最后一条原生命令的退出码当作步骤退出码，
      #    导致步骤失败。现改用 git ls-remote(不依赖本地克隆历史)并
      #    显式 exit 0，git 失败时静默降级为 "dev"。
      - name: Resolve app version
        id: ver
        shell: pwsh
        run: |
          $ver = "dev"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $tags = git ls-remote --tags --refs origin 2>$null
            if ($tags) {
              $latestTag = $tags |
                ForEach-Object { ($_ -split 'refs/tags/')[-1] } |
                Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
                Sort-Object { [version]($_ -replace '^v', '') } -Descending |
                Select-Object -First 1
              if ($latestTag) { $ver = $latestTag -replace '^v', '' }
            }
          }
          Write-Host "app version: $ver"
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Build static exe (build_static.bat)
        shell: cmd
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          call cpp\build_static.bat

      # 验证产物 SuperCOM.exe（无 UPX，Defender 干净）
      - name: Verify artifact
        shell: pwsh
        run: |
          $exe = Get-Item "cpp\dist_static\SuperCOM.exe"
          Write-Host "exe size: $($exe.Length) bytes"
          if ($exe.Length -gt 100MB) { throw "exe unexpectedly large: $($exe.Length)" }
          if ($exe.Length -lt 5MB)   { throw "exe too small: $($exe.Length)" }
          Write-Host "artifact OK: $($exe.Length) bytes (~20MB, no UPX, Defender clean)"

      # 非 tag 构建：更新固定的 "dev-build" 草稿 Release，页面可直接看到/下载
      # 两个 exe（Actions artifact 强制打包成 zip，无法直接展示 exe，故用 draft release）。
      # 先删旧草稿(含其自动 tag)再重建，保证 Release 列表只有一个 Dev build 入口。
      - name: Delete old dev-build draft (if any)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-build --repo ${{ github.repository }} --yes --cleanup-tag 2>$null
          exit 0

      - name: Upload dev build to draft release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build
          name: Dev build ${{ steps.ver.outputs.version }}
          draft: true
          body: |
            CI 自动构建产物（master 推送 / 手动触发）。
            无 UPX 版（Defender 干净，推荐）。
          files: |
            cpp/dist_static/SuperCOM.exe
          fail_on_unmatched_files: false

      # 仅在 tag 推送时创建正式 Release（手动触发则跳过，仅构建验证）
      - name: Create Release & upload
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cpp/dist_static/SuperCOM.exe
          generate_release_notes: true
          fail_on_unmatched_files: false
